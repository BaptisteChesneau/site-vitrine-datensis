{% extends 'base.html' %}{% block content %}<main class="auth-shell"><div class="auth-intro"><div class="brand">✦ DATENSIS <span>EXPERT</span></div><h1>Définir un <em>nouveau mot de passe.</em></h1></div><section class="auth-card"><div class="pill">SÉCURITÉ</div><h2>Nouveau mot de passe</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Mot de passe<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>Confirmation<input name="confirm_password" type="password" minlength="12" required autocomplete="new-password"></label><small>12 caractères minimum, une majuscule, un chiffre et un symbole.</small><button class="primary" type="submit">Enregistrer le mot de passe</button></form></section></main>{% endblock %}
