<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activer la double authentification - DATENSIS Expert</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main style="max-width:540px;margin:5rem auto;padding:2rem"><h1>Activer la double authentification</h1>{% with messages = get_flashed_messages() %}{% for message in messages %}<p role="alert">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p>Scannez ce QR code avec votre application Authenticator.</p><img src="{{ qr_data }}" alt="QR code TOTP"><p>Clé manuelle : <code>{{ secret }}</code></p><label>Code à 6 chiffres <input name="code" autocomplete="one-time-code" required pattern="[0-9]{6}" maxlength="6"></label><p><button type="submit">Valider</button></p></form></main></body></html>
