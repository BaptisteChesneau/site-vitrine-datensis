{% extends 'base.html' %}{% block content %}<main class="auth-shell"><div class="auth-intro"><div class="brand">✦ DATENSIS <span>EXPERT</span></div><h1>Votre espace client,<br><em>à portée de main.</em></h1><p>Créez votre compte pour accéder à votre tableau de bord.</p></div><section class="auth-card"><div class="pill">INSCRIPTION CLIENT</div><h2>Créer un compte</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nom complet<input name="name" maxlength="100" required autocomplete="name"></label><label>Adresse e-mail<input name="email" type="email" required autocomplete="email"></label><label>Mot de passe (12 caractères minimum)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><button class="primary">Créer mon compte →</button></form><p class="auth-foot"><a href="{{ url_for('portal') }}">← Retour à la connexion</a></p></section></main>{% endblock %}
