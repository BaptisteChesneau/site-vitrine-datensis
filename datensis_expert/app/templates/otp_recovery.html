<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codes de récupération - DATENSIS Expert</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main style="max-width:540px;margin:5rem auto;padding:2rem"><h1>Codes de récupération</h1>{% with messages = get_flashed_messages() %}{% for message in messages %}<p role="alert">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p>Enregistrez ces codes dans un endroit sûr. Ils ne seront plus affichés.</p><ul>{% for code in codes %}<li><code>{{ code }}</code></li>{% endfor %}</ul><p><button type="submit">Continuer</button></p></form></main></body></html>
